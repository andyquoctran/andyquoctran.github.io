<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
    {% include mathjax.html %}
  </head>

  <body>
    <div class="site-shell">
      <aside class="sidebar">
        <a class="site-name" href="{{ '/' | relative_url }}">andy q tran</a>

        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"
             {% if page.url == '/' %}aria-current="page"{% endif %}>me</a>
          <a href="{{ '/research/' | relative_url }}"
             {% if page.url == '/research/' %}aria-current="page"{% endif %}>research</a>
          <a href="{{ '/misc/' | relative_url }}"
             {% if page.url == '/misc/' %}aria-current="page"{% endif %}>misc</a>
        </nav>
      </aside>

      <main data-page="{{ page.url | escape }}" class="page{% unless page.image %} page--text-only{% endunless %}{% if page.section_figures %} page--section-figures{% endif %}">
        <section class="page-copy">
          {{ content }}
        </section>

        {% if page.image %}
          <aside class="image-space" aria-label="Image area">
            <figure class="image-figure{% if page.image_type == 'diagram' %} image-figure--diagram{% endif %}">
              <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: '' }}">
              {% if page.image_caption %}
                <figcaption>{{ page.image_caption }}</figcaption>
              {% endif %}
            </figure>
          </aside>
        {% endif %}
      </main>
    </div>
  </body>
</html>
